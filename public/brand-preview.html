<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>HollyMusic · 冬青音符候选预览</title>
  <link rel="icon" href="/brand/holly-favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; --paper: #f4f3ee; --card: #fcfcf8; --ink: #225c46; --text: #203b30; --muted: #77847c; --line: #dedfd5; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--text); font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; -webkit-font-smoothing: antialiased; }
    body:has(#theme:checked) { color-scheme: dark; --paper: #14211b; --card: #1b2b23; --ink: #f7f5ef; --text: #f7f5ef; --muted: #a0b1a5; --line: #34453b; }
    a { color: inherit; text-underline-offset: 5px; }
    .page { width: min(1160px, 100% - 64px); margin: 0 auto; padding: 32px 0 40px; }
    header, .tools, .panel-head, .icon-row, .size-row, footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    header { padding-bottom: 24px; border-bottom: 1px solid var(--line); }
    .brand { width: 153px; height: auto; display: block; }
    .eyebrow { margin: 0; font-size: 11px; letter-spacing: .17em; color: var(--muted); }
    .tools { gap: 24px; font-size: 12px; }
    .theme-toggle { position: relative; cursor: pointer; border: 1px solid var(--line); border-radius: 99px; padding: 10px 16px; background: var(--card); color: var(--text); }
    .theme-toggle:hover { border-color: var(--ink); }
    .theme-toggle:focus-within { outline: 2px solid var(--ink); outline-offset: 3px; }
    #theme { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .theme-dark { display: none; }
    body:has(#theme:checked) .theme-light { display: none; }
    body:has(#theme:checked) .theme-dark { display: inline; }
    .hero { display: grid; grid-template-columns: 1fr 1fr; align-items: center; min-height: 330px; gap: 48px; padding: 32px 0; }
    h1 { margin: 18px 0 16px; font-size: clamp(32px, 4.4vw, 54px); font-weight: 500; line-height: 1.35; letter-spacing: -.05em; }
    .intro { margin: 0; font-size: 13px; line-height: 1.9; color: var(--muted); }
    .hero-art { display: grid; place-items: center; }
    .hero-art img { width: 230px; height: auto; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 24px; min-width: 0; }
    .panel-head { margin-bottom: 24px; font-size: 12px; }
    .panel-head small { font-size: 10px; color: var(--muted); letter-spacing: .1em; }
    .header-example { display: flex; min-height: 90px; padding: 24px; align-items: center; justify-content: space-between; gap: 20px; border: 1px solid #e2e6dc; border-radius: 12px; background: #f7f5ef; color: #225c46; }
    .header-example img { width: 180px; height: auto; }
    .header-example.dark { background: #192b22; color: #f7f5ef; border-color: #344b3d; margin-top: 12px; }
    .nav { display: flex; gap: 18px; font-size: 11px; }
    .nav span:last-child { opacity: .5; }
    .icon-row { justify-content: center; gap: 32px; min-height: 192px; }
    figure { margin: 0; text-align: center; }
    figcaption { margin-top: 12px; font-size: 10px; letter-spacing: .08em; color: var(--muted); }
    .icon-row img { width: 104px; height: 104px; display: block; }
    .circle-mask { border-radius: 50%; }
    .squircle-mask { border-radius: 24px; }
    .size-row { min-height: 112px; justify-content: flex-start; gap: 30px; padding: 12px 2px; }
    .size-sample { display: flex; align-items: center; justify-content: center; height: 64px; }
    .size-sample img { display: block; }
    .note { margin: 12px 0 0; font-size: 11px; line-height: 1.8; color: var(--muted); }
    .mono-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .mono { display: grid; place-items: center; height: 126px; border-radius: 12px; background: #f0f2e9; }
    .mono.dark { background: #225c46; }
    .mono img { width: 80px; height: 80px; }
    footer { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); flex-wrap: wrap; }
    .light-asset { display: none; }
    body:has(#theme:checked) .light-asset { display: block; }
    body:has(#theme:checked) .dark-asset { display: none; }
    @media (max-width: 700px) {
      .page { width: calc(100% - 32px); padding-top: 20px; }
      .tools { gap: 12px; }
      .tools a { display: none; }
      .hero { grid-template-columns: 1fr 1fr; gap: 16px; min-height: 250px; }
      .hero-art img { width: min(160px, 100%); }
      .intro { font-size: 11px; }
      .grid { grid-template-columns: 1fr; }
      .panel { padding: 20px; }
      .header-example { padding: 18px; gap: 12px; }
      .header-example img { width: 160px; }
      .nav { gap: 10px; }
      .icon-row { gap: 22px; }
      .icon-row img { width: 88px; height: 88px; }
      .size-row { gap: 24px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <img class="brand dark-asset" src="/brand/holly-horizontal.svg" alt="hollymusic">
      <img class="brand light-asset" src="/brand/holly-horizontal-light.svg" alt="hollymusic">
      <div class="tools"><a href="/">打开播放器 ↗</a><label class="theme-toggle"><input type="checkbox" id="theme" role="switch" aria-label="深色预览"><span class="theme-light">切换深色</span><span class="theme-dark">切换浅色</span></label></div>
    </header>
    <section class="hero">
      <div><p class="eyebrow">HOLLYMUSIC / 候选预览 · 未启用</p><h1>一颗浆果，<br>一枚音符。</h1><p class="intro">冬青的叶与果，长成音乐的形状。<br>自然、温暖，也清晰。</p></div>
      <div class="hero-art"><img class="dark-asset" src="/brand/holly-stacked.svg" alt="冬青音符与 hollymusic 字标"><img class="light-asset" src="/brand/holly-stacked-light.svg" alt="冬青音符与 hollymusic 浅色字标"></div>
    </section>
    <div class="grid">
      <section class="panel">
        <div class="panel-head"><span>01 / 横排组合</span><small>LIGHT & DARK</small></div>
        <div class="header-example"><img src="/brand/holly-horizontal.svg" alt="浅色横排 logo"><div class="nav"><span>发现</span><span>我的音乐</span></div></div>
        <div class="header-example dark"><img src="/brand/holly-horizontal-light.svg" alt="深色横排 logo"><div class="nav"><span>发现</span><span>我的音乐</span></div></div>
      </section>
      <section class="panel">
        <div class="panel-head"><span>02 / 应用图标</span><small>PWA & HOME SCREEN</small></div>
        <div class="icon-row">
          <figure><img src="/brand/holly-app.svg" alt="圆角应用图标"><figcaption>应用图标</figcaption></figure>
          <figure><img class="circle-mask" src="/brand/holly-app-maskable.svg" alt="圆形遮罩图标"><figcaption>圆形裁切</figcaption></figure>
          <figure><img class="squircle-mask" src="/brand/holly-app-maskable.svg" alt="方形遮罩图标"><figcaption>圆角裁切</figcaption></figure>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head"><span>03 / 原尺寸检查</span><small>16 · 24 · 32 · 48 · 64 PX</small></div>
        <div class="size-row">
          <figure><div class="size-sample"><img src="/brand/holly-favicon.svg" width="16" height="16" alt="16 像素 favicon"></div><figcaption>16 px</figcaption></figure>
          <figure><div class="size-sample"><img src="/brand/holly-favicon.svg" width="24" height="24" alt="24 像素 favicon"></div><figcaption>24 px</figcaption></figure>
          <figure><div class="size-sample"><img src="/brand/holly-favicon.svg" width="32" height="32" alt="32 像素 favicon"></div><figcaption>32 px</figcaption></figure>
          <figure><div class="size-sample"><img src="/brand/holly-app.svg" width="48" height="48" alt="48 像素应用图标"></div><figcaption>48 px</figcaption></figure>
          <figure><div class="size-sample"><img src="/brand/holly-app.svg" width="64" height="64" alt="64 像素应用图标"></div><figcaption>64 px</figcaption></figure>
        </div>
        <p class="note">16–32 px 使用无叶脉版本。以上为原尺寸显示。</p>
      </section>
      <section class="panel">
        <div class="panel-head"><span>04 / 单色标记</span><small>ONE SHAPE, ONE COLOR</small></div>
        <div class="mono-row"><div class="mono"><img src="/brand/holly-mark-mono.svg" alt="深绿单色标记"></div><div class="mono dark"><img src="/brand/holly-mark-mono-light.svg" alt="暖白单色标记"></div></div>
        <p class="note">即使去掉颜色，依然保留冬青音符的轮廓。</p>
      </section>
    </div>
    <footer><span>HOLLYMUSIC · 把时间交给音乐</span><span><a href="/brand/holly-mark.svg" download>图形 SVG</a>　<a href="/brand/holly-horizontal.svg" download>横排 SVG</a>　<a href="/brand/holly-stacked.svg" download>竖排 SVG</a></span></footer>
  </main>
</body>
</html>
